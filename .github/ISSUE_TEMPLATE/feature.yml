name: Feature proposal
description: Propose a grounded learning, reliability, or interoperability improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: learner_problem
    attributes:
      label: Learner problem
      description: Describe the study failure or friction before proposing implementation.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evaluation evidence
      description: Explain how we could prove the change improves behavior without weakening safety.
    validations:
      required: true
  - type: textarea
    id: persistence
    attributes:
      label: Persistence or migration impact

